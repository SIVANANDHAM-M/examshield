server.port=8081
spring.application.name=examshield-backend

# Default Database Configuration (H2 in-memory with MySQL compatibility for instant evaluation out-of-the-box)
# To use external MySQL, configure the variables below or run with --spring.profiles.active=mysql
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:examshield;DB_CLOSE_DELAY=-1;MODE=MySQL}
spring.datasource.driverClassName=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# JPA / Hibernate Configuration
spring.jpa.database-platform=${SPRING_JPA_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.sql.init.mode=never

# H2 Console (available at /h2-console during evaluation)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Security & Cryptography Configuration
# In production, provide 32-character or base64 keys via environment variables
examshield.jwt.secret=${JWT_SECRET:ExamShieldSuperSecretKeyForJwtTokenSigningMustBeLongEnough2026!}
examshield.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
examshield.crypto.aes-secret=${AES_SECRET_KEY:ExamShieldAes256SecretKey2026!}

# Logging
logging.level.com.examshield=INFO
logging.level.org.springframework.security=WARN
